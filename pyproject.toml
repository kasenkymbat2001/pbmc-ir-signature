[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irsig"
version = "0.1.0"
description = "Leakage-safe, platform-robust PBMC insulin-resistance transcriptomic score"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4",
  "statsmodels>=0.14", "matplotlib>=3.8", "anndata>=0.10", "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
irsig = "irsig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
